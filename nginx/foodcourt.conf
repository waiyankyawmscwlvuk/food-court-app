# ─────────────────────────────────────────────────────────────────────────────
# Host-level nginx config for Food Court app
# Installed at: /etc/nginx/sites-available/foodcourt
# Symlinked to: /etc/nginx/sites-enabled/foodcourt
#
# This nginx runs ON the DigitalOcean droplet (not inside Docker).
# It owns ports 80 and 443, and proxies traffic to the Docker nginx
# which listens on 127.0.0.1:8080 (internal only).
#
# SSL certificate files from Namecheap:
#   certificate.crt  ──┐  combined into foodcourt.crt
#   ca_bundle.crt    ──┘
#   private.key      →  foodcourt.key
# ─────────────────────────────────────────────────────────────────────────────

# ── Redirect all HTTP → HTTPS ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    return 301 https://$host$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yourdomain.com www.yourdomain.com;

    # ── Namecheap SSL certificate ─────────────────────────────────────────────
    # Combine cert + chain before using:
    #   cat certificate.crt ca_bundle.crt > /etc/nginx/ssl/foodcourt.crt
    ssl_certificate     /etc/nginx/ssl/foodcourt.crt;
    ssl_certificate_key /etc/nginx/ssl/foodcourt.key;

    # ── Modern SSL settings ───────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin" always;

    # ── Proxy everything to Docker nginx on localhost:8080 ────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;   # tells Django it's HTTPS
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        keep-alive;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }
}
