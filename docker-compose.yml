services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: foodcourt_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-foodcourt_db}
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-foodcourt_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ── Django backend ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodcourt_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: db          # override .env so Django connects to the container
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py seed_data &&
             gunicorn foodcourt.wsgi:application
               --bind 0.0.0.0:8000
               --workers 3
               --timeout 120
               --access-logfile -
               --error-logfile -"


  # ── React frontend + Nginx ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""   # empty = relative /api path (Nginx proxies it)
    container_name: foodcourt_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - media_files:/app/media   # shared with backend so nginx serves QR codes & uploads directly
    networks:
      - internal
    depends_on:
      - backend


volumes:
  postgres_data:
  media_files:
  static_files:


networks:
  internal:
    driver: bridge
