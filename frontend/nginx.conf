server {
    listen 80;
    server_name _;

    # Increase upload size for QR code / PDF responses
    client_max_body_size 20M;

    # ── React SPA ─────────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # All unknown routes fall back to index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy /api → Django backend ───────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Proxy /admin → Django admin ───────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Serve uploaded media files (QR codes, images) directly from disk ─────
    # The media_files Docker volume is mounted at /app/media in both the
    # backend and frontend containers. Nginx serves it directly — Django's
    # static() helper is a no-op in production (DEBUG=False), so proxying
    # to the backend would always return 404.
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Proxy /static → Django static files ───────────────────────────────────
    location /static/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
